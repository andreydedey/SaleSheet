server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://salesheet-production.up.railway.app;
        proxy_ssl_server_name on;
        proxy_set_header Host salesheet-production.up.railway.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
