server:
  servlet:
    context-path: /api
    session:
      timeout: 8h
  forward-headers-strategy: framework
spring:
  application:
    name: saleSheet
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:salesheet}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:password}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

app:
  mail:
    from: ${MAIL_FROM}
  url: ${APP_URL:http://localhost:5173}